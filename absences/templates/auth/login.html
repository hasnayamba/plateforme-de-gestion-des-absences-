{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestion des Absences{% endblock %}</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<style>

/* ========================
   🎨 VARIABLES SWISSCONTACT
======================== */
:root {
    --primary: #005AA9;
    --secondary: #0073CF;
    --light-bg: #F4F7FB;
    --white: #FFFFFF;
    --border: #E5EAF0;
    --text: #2C3E50;
    --gray: #6C7A89;
}

/* ========================
   GLOBAL
======================== */
body {
    background: linear-gradient(135deg, #f4f7fb, #eef3f9);
    font-family: 'Segoe UI', sans-serif;
    color: var(--text);
}

/* ========================
   CONTAINER PRINCIPAL
======================== */
.main-container {
    margin-top: 90px;
    min-height: calc(100vh - 160px);
}

/* ========================
   BOX (LOGIN / FORM / CARD)
======================== */
.login-box {
    max-width: 420px;
    margin: auto;
    padding: 35px;
    background-color: var(--white);
    border-radius: 20px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.07);
    transition: 0.25s ease;
}

/* Effet hover subtil */
.login-box:hover {
    transform: translateY(-2px);
}

/* ========================
   NAVBAR BRAND
======================== */
.navbar-brand {
    font-weight: 600;
    letter-spacing: 0.4px;
}

/* ========================
   FOOTER
======================== */
footer {
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    color: white;
    text-align: center;
    padding: 15px 0;
    width: 100%;
}

/* ========================
   FORM ELEMENTS
======================== */
input, select, textarea {
    border-radius: 8px !important;
    border: 1px solid var(--border);
    padding: 10px;
    transition: 0.2s;
}

input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 0.15rem rgba(0, 90, 169, 0.15);
}

/* ========================
   BUTTONS
======================== */
.btn-primary {
    background: var(--primary);
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    transition: 0.25s;
}

.btn-primary:hover {
    background: var(--secondary);
    transform: translateY(-1px);
}

/* ========================
   TITRES
======================== */
h1, h2, h3, h4 {
    color: var(--primary);
    font-weight: 600;
}

/* ========================
   TEXTES SECONDAIRES
======================== */
.text-muted {
    opacity: 0.65;
}

.navbar {
    background: linear-gradient(90deg, var(--primary), var(--secondary)) !important;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    padding: 12px 24px;
}

.navbar-brand strong {
    color: white;
    font-size: 15px;
    letter-spacing: 0.3px;
}

/* ========================
   ALERTES (PROPRE)
======================== */
.alert {
    border-radius: 10px;
    border: none;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
}

/* ========================
   LABELS FORM
======================== */
label {
    font-weight: 500;
    margin-bottom: 4px;
}

/* ========================
   ESPACEMENTS PROPRES
======================== */
.form-group {
    margin-bottom: 15px;
}

/* ========================
   MICRO-INTERACTIONS (UX)
======================== */
button:active {
    transform: scale(0.98);
}

</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark  fixed-top shadow-sm">
    <img src="{% static 'images/logo-swisscontact.png' %}" 
                 alt="Swisscontact" 
                 height="40" 
                 class="me-2">
    <div class="container">
        <a class="navbar-brand" href="#">Gestion des Absences</a>
    </div>
</nav>

<!-- Contenu principal -->
<div class="container main-container">
    {% block content %}
    <div class="login-box">
        <h3 class="text-center mb-4">Connexion</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>
    </div>
    {% endblock %}
</div>

<!-- Footer -->
<footer class="mt-5">
    <div class="container">
        <small>&copy; {{ now|date:"Y" }} - Swisscontact | Application de gestion des absences</small>
    </div>
</footer>

<!-- Scripts Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
